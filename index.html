<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/rhinoblox_icon.svg">
  <title>RhinoBlox</title>
  <!-- RhinoBlox 3.2 by AblazeMuffin35 -->
</head>
<body style="opacity: 0;">
  <dialog id="aboutDialog">
    <div class="dialog-top-bar">About RhinoBlox</div>
    <div class="dialog-content">
      <img src="/assets/rhinoblox_logo.png" height="100">
      <div>
        <div class="dialog-content-heading">Version Data</div>
        RhinoBlox Version: 3.2<br>
        Blockly Version: 12.3.1<br>
        Monaco Version: 0.55.1<br>
        Shiki Version: 3.20.0<br>
        JS-Beautify Version: 1.15.4<br>
      </div>
      <div>
        <div class="dialog-content-heading">Creator</div>
        AblazeMuffin35<br>
      </div>
      <div>
        <div class="dialog-content-heading">Contributors</div>
        AblazeMuffin35<br>
        ItalianYeney1<br>
        Polaradian<br>
        Tech72Wizard<br>
        Page<br>
      </div>
      <div style="margin-bottom: 10px">
        <div class="dialog-content-heading">License</div>
        GNU GPLv3
      </div>
      <img src="/assets/rhinus_games_logo.png" height="100">
    </div>
  </dialog>

  <dialog id="programDialog">
    <div class="dialog-top-bar">Program</div>
    <iframe id="programFrame" srcdoc=""></iframe>
  </dialog>

  <div id="top-bar">
    <img src="/assets/rhinoblox_logo.png"><div class="top-bar-spacer"></div><span id="aboutButton">About</span><input type="text" id="projectNameInput" placeholder="Project Name"></input></span>
    <span style="float: right;" id="saveButton">Save</span><span style="float: right;" id="loadButton">Load</span>
  </div>

  <div id="container">
    <div id="blocklyArea">
      <div id="blocklyDiv"></div>
    </div>
    <div id="outputArea">
      <div id="controls">
        <button id="startButton">Start Program</button>
      </div>
      <div id="generatedCode"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="src/blockly/setup.js"></script>
  <script type="module" src="src/blockly/generation.js"></script>
  <script type="module" src="src/ui/monaco_editor.js"></script>
  <script type="module" src="src/ui/main.js"></script>
</body>
</html>
